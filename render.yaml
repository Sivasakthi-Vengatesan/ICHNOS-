services:
  # Backend FastAPI + Z3 SMT Engine
  - type: web
    name: tracelake-v-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        value: sqlite:///tracelake.db
      - key: PYTHONPATH
        value: .

  # Frontend Bauhaus Technical Instrument UI
  - type: web
    name: tracelake-v-frontend
    env: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
